<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Challenge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🧩 Puzzle Challenge</h1>

    <p class="welcome">
        Welcome to the Puzzle Challenge!
        <br><br>
        Solve all four puzzles and see your final score.
    </p>

    <div class="rules">

        <h2>Game Rules</h2>

        <ul>
            <li>✔ Solve all 4 puzzles.</li>
            <li>✔ Type the answer carefully.</li>
            <li>✔ Answers are not case-sensitive.</li>
            <li>✔ Each correct answer gives 1 point.</li>
            <li>✔ Maximum Score = 4</li>

        </ul>

    </div>

    <button id="startBtn">
        🚀 Start Game
    </button>

</div>

<script>

    // Reset previous score
    localStorage.setItem("score", 0);

    document.getElementById("startBtn").addEventListener("click", function () {

        window.location.href = "puzzle1.html";

    });

</script>

</body>
</html>
